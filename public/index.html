<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth · Family memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F6FA;
  --surface: #FFFFFF;
  --ink: #1F2A44;
  --ink-soft: #55607A;
  --rule: #DDE2EC;
  --lamp: #E8A317;
  --lamp-wash: #FFF4DA;
  --aarav: #D9940F;
  --priya: #3B6EA8;
  --rohan: #4E7D5B;
  --dadu: #A04E6E;
  --focus: #3B6EA8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131A2A; --surface: #1B2338; --ink: #E9ECF4; --ink-soft: #A3ACC2; --rule: #2C3650;
    --lamp: #F2B53A; --lamp-wash: #2B2716; --aarav: #F2B53A; --priya: #7FA8DC; --rohan: #84B793; --dadu: #D58AA6; --focus: #7FA8DC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131A2A; --surface: #1B2338; --ink: #E9ECF4; --ink-soft: #A3ACC2; --rule: #2C3650;
  --lamp: #F2B53A; --lamp-wash: #2B2716; --aarav: #F2B53A; --priya: #7FA8DC; --rohan: #84B793; --dadu: #D58AA6; --focus: #7FA8DC;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.55 Figtree, system-ui, sans-serif;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 600px) { .wrap { padding: 0 16px; } }

/* header */
header.top { display: flex; align-items: center; gap: 16px; padding: 20px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; margin-right: auto; }
.brand svg { width: 28px; height: 28px; }
.viewer { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 14px; }
select, button {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
button.primary { background: var(--lamp); border-color: var(--lamp); color: #1F2A44; font-weight: 600; }
button.primary:hover { filter: brightness(1.05); }

/* hero: the child's own words, growing */
.growth { padding: 40px 0 48px; border-bottom: 1px solid var(--rule); }
.growth h1 { font-size: 15px; font-weight: 600; color: var(--ink-soft); margin: 0 0 24px; }
.answers { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); gap: 32px; align-items: end; }
@media (max-width: 760px) { .answers { grid-template-columns: 1fr; gap: 20px; } }
.answer q { quotes: none; font-family: Literata, Georgia, serif; display: block; }
.answer.then q { font-size: 20px; line-height: 1.4; color: var(--ink-soft); }
.answer.now q { font-size: clamp(24px, 3.4vw, 36px); line-height: 1.32; font-weight: 400; max-width: 30ch; }
.answer.now q::first-letter { color: var(--aarav); }
.answer .when { font-size: 14px; color: var(--ink-soft); margin-top: 10px; }
.answer.now .when strong { color: var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 12px 40px; margin-top: 36px; }
.fact b { display: block; font-size: 28px; font-weight: 700; line-height: 1.1; }
.fact span { font-size: 14px; color: var(--ink-soft); }
.weeks { display: flex; align-items: flex-end; gap: 10px; height: 64px; margin-left: auto; padding-bottom: 20px; box-sizing: content-box; }
.weeks div { width: 40px; background: var(--aarav); border-radius: 4px 4px 0 0; opacity: .85; position: relative; }
.weeks div span { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
.newwords { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.newwords > span:first-child { font-size: 14px; color: var(--ink-soft); margin-right: 4px; }
.word { font-family: Literata, Georgia, serif; font-style: italic; background: var(--lamp-wash); padding: 2px 10px; border-radius: 999px; }
.disclaimer { font-size: 13px; color: var(--ink-soft); margin-top: 20px; }

/* sections */
main.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; padding: 40px 0 64px; }
@media (max-width: 860px) { main.grid { grid-template-columns: 1fr; gap: 40px; } }
h2 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }

/* threads: a line connecting two people */
.thread { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--rule); }
.thread:first-of-type { border-top: 0; }
.link { display: flex; flex-direction: column; align-items: center; }
.link .dot { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.link .line { width: 2px; flex: 1; min-height: 14px; background: var(--rule); }
.thread .who { font-size: 14px; color: var(--ink-soft); }
.thread .who strong { color: var(--ink); font-weight: 600; }
.thread p { margin: 4px 0 0; font-family: Literata, Georgia, serif; font-size: 16px; line-height: 1.6; }
.status { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-left: 6px; }
.status.pending { background: var(--lamp-wash); color: var(--ink); }
.status.used { color: var(--ink-soft); border: 1px solid var(--rule); }

/* memoir */
.memoir { margin-bottom: 40px; }
.chapter { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.chapter .bar { grid-column: 1 / -1; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.chapter .bar i { display: block; height: 100%; background: var(--dadu); }
.chapter small { color: var(--ink-soft); }

/* timeline */
.entry { padding: 12px 0 12px 16px; border-left: 3px solid var(--c, var(--rule)); margin-bottom: 10px; }
.entry .meta { font-size: 13px; color: var(--ink-soft); }
.entry .meta strong { color: var(--c); font-weight: 600; }
.entry p { margin: 2px 0 0; font-size: 15px; }
.family { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 20px; font-size: 14px; }
.family span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; }

/* radio dialog */
dialog { border: 0; border-radius: 16px; padding: 0; max-width: 620px; width: calc(100% - 32px); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(19, 26, 42, .55); }
.radio { padding: 28px 28px 24px; }
.radio h3 { margin: 0 0 4px; font-size: 22px; }
.radio .script { font-family: Literata, Georgia, serif; font-size: 17px; line-height: 1.7; max-height: 55vh; overflow: auto; margin: 16px 0; }
.radio .script p { margin: 0 0 14px; }
.radio .row { display: flex; gap: 8px; justify-content: flex-end; }
.error { padding: 40px 0; color: var(--ink-soft); }
@media (prefers-reduced-motion: no-preference) {
  .answer.now q { animation: rise .8s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4c3 4 7 7 7 13a7 7 0 1 1-14 0c0-3 1.5-5 3-6.5 0 2.5 1 4 2.5 4.5C14 11 14 8 16 4z" fill="var(--lamp)"/><path d="M6 27h20" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/></svg>
      Hearth
    </div>
    <label class="viewer">Viewing as
      <select id="viewer"><option>Priya</option><option>Rohan</option></select>
    </label>
    <button class="primary" id="radioBtn" type="button">Play Family Radio</button>
  </header>
</div>

<section class="growth"><div class="wrap" id="growth"></div></section>

<div class="wrap">
  <main class="grid">
    <section>
      <h2>Family threads</h2>
      <p class="sub">Stories one person tells become questions for someone else.</p>
      <div id="threads"></div>
    </section>
    <section>
      <div class="memoir" id="memoir"></div>
      <h2>This week at home</h2>
      <p class="sub">Shared entries only. Private ones stay with whoever said them.</p>
      <div class="family" id="family"></div>
      <div id="timeline"></div>
    </section>
  </main>
</div>

<dialog id="radio" aria-labelledby="radioTitle">
  <div class="radio">
    <h3 id="radioTitle">Family Radio</h3>
    <div class="sub" id="radioSub"></div>
    <div class="script" id="radioScript"></div>
    <div class="row">
      <button type="button" id="speakBtn">Read aloud</button>
      <button type="button" class="primary" id="closeRadio">Close</button>
    </div>
  </div>
</dialog>

<script>
const COLORS = { Aarav: "var(--aarav)", Priya: "var(--priya)", Rohan: "var(--rohan)", Dadu: "var(--dadu)" };
const color = (n) => COLORS[n] || "var(--ink-soft)";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (id) => document.getElementById(id);

let viewer = "Priya";
try { viewer = localStorage.getItem("hearth.viewer") || viewer; } catch {}
$("viewer").value = viewer;

function times(pct) {
  if (pct >= 100) return `${Math.round((1 + pct / 100) * 10) / 10}×`;
  return `${pct > 0 ? "+" : ""}${pct}%`;
}

function renderGrowth(k) {
  if (!k) { $("growth").innerHTML = `<p class="error">Add a child to the family to see speaking practice here.</p>`; return; }
  const max = Math.max(...k.weekly.map((w) => w.avg_words), 1);
  $("growth").innerHTML = `
    <h1>How ${esc(k.child)}'s answers have grown</h1>
    <div class="answers">
      ${k.first_answer ? `<div class="answer then"><q>${esc(k.first_answer.text)}</q><div class="when">${esc(k.first_answer.date)} · ${k.first_answer.words} words</div></div>` : ""}
      ${k.latest_answer ? `<div class="answer now"><q>${esc(k.latest_answer.text)}</q><div class="when"><strong>${esc(k.latest_answer.date)}</strong> · ${k.latest_answer.words} words</div></div>` : ""}
    </div>
    <div class="facts">
      <div class="fact"><b>${times(k.sentence_length_change_pct)}</b><span>longer sentences than week one</span></div>
      <div class="fact"><b>${k.vocabulary_size}</b><span>different words used</span></div>
      <div class="fact"><b>${k.streak_days} days</b><span>practice streak</span></div>
      <div class="weeks" role="img" aria-label="Average words per answer by week: ${k.weekly.map((w) => `${w.week} ${w.avg_words}`).join(", ")}">
        ${k.weekly.map((w) => `<div style="height:${Math.max(4, (w.avg_words / max) * 64)}px" title="Week of ${esc(w.week)}: ${w.avg_words} words per answer"><span>${esc((w.week.split(",")[1] || w.week).trim().replace(/(\w{3})\w*$/, "$1"))}</span></div>`).join("")}
      </div>
    </div>
    ${k.recent_new_words.length ? `<div class="newwords"><span>New words lately</span>${k.recent_new_words.map((w) => `<span class="word">${esc(w)}</span>`).join("")}</div>` : ""}
    <p class="disclaimer">${esc(k.note)}</p>`;
}

function renderThreads(threads) {
  const rows = threads.filter((t) => t.status !== "superseded").slice(0, 8);
  $("threads").innerHTML = rows.length ? rows.map((t) => `
    <div class="thread">
      <div class="link">
        <div class="dot" style="background:${t.kind === "care_nudge" ? "var(--lamp)" : color(t.from)}">${t.kind === "care_nudge" ? "♥" : esc(t.from[0])}</div>
        <div class="line"></div>
        <div class="dot" style="background:${color(t.to)}">${esc(t.to[0])}</div>
      </div>
      <div>
        <div class="who">${t.kind === "care_nudge" ? "Care nudge" : `From <strong>${esc(t.from)}</strong>`} for <strong>${esc(t.to)}</strong> · ${esc(t.created)}
          <span class="status ${t.status}">${t.status === "pending" ? "Waiting" : "Answered"}</span></div>
        <p>${esc(t.prompt)}</p>
      </div>
    </div>`).join("") : `<p class="sub">No threads yet. They appear once someone tells a story.</p>`;
}

function renderMemoir(elders) {
  $("memoir").innerHTML = elders.map((e) => {
    const total = e.chapters.reduce((s, c) => s + c.stories, 0);
    return `<h2>${esc(e.called || e.name)}'s memoir</h2><p class="sub">${total} stories so far, one question a day.</p>
      ${e.chapters.map((c) => `<div class="chapter"><span>${esc(c.chapter)}</span><small>${c.stories}${c.questions ? ` of ${c.questions}` : ""}</small>
      <div class="bar"><i style="width:${c.questions ? Math.min(100, (c.stories / c.questions) * 100) : 100}%"></i></div></div>`).join("")}`;
  }).join("");
}

function renderTimeline(family, timeline) {
  $("family").innerHTML = family.map((m) => `<span style="--c:${color(m.name)}">${esc(m.called && m.called !== m.name ? `${m.name} (${m.called})` : m.name)}</span>`).join("");
  $("timeline").innerHTML = timeline.slice(0, 14).map((e) => `
    <div class="entry" style="--c:${color(e.who)}">
      <div class="meta"><strong>${esc(e.who)}</strong> · ${esc(e.date)}${e.chapter ? ` · ${esc(e.chapter)}` : ""}</div>
      <p>${esc(e.summary.replace(/^[^:]{1,20}:\s*/, ""))}</p>
    </div>`).join("");
}

async function load() {
  try {
    const r = await fetch(`api/dashboard?viewer=${encodeURIComponent(viewer)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    renderGrowth(d.kids[0]);
    renderThreads(d.threads);
    renderMemoir(d.elders);
    renderTimeline(d.family, d.timeline);
  } catch (e) {
    $("growth").innerHTML = `<p class="error">Couldn't load the family journal: ${esc(e.message)}. Check that the Hearth server is running and seeded (npm run seed).</p>`;
  }
}

$("viewer").addEventListener("change", (e) => {
  viewer = e.target.value;
  try { localStorage.setItem("hearth.viewer", viewer); } catch {}
  load();
});

$("radioBtn").addEventListener("click", async () => {
  $("radioScript").innerHTML = "<p>Writing this week's episode…</p>";
  $("radioSub").textContent = "";
  $("radio").showModal();
  try {
    const r = await fetch(`api/radio?viewer=${encodeURIComponent(viewer)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    $("radioSub").textContent = `The last ${d.period_days} days, as Alexa will read it on Sunday evening.`;
    $("radioScript").innerHTML = d.script.split(/\n+/).filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join("");
  } catch (e) {
    $("radioScript").innerHTML = `<p>Couldn't write the episode: ${esc(e.message)}</p>`;
  }
});
$("speakBtn").addEventListener("click", () => {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance($("radioScript").innerText));
});
$("closeRadio").addEventListener("click", () => { speechSynthesis?.cancel(); $("radio").close(); });

load();
</script>
</body>
</html>
